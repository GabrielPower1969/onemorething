# Checks only. Deploys happen from a maintainer's machine (docs/LAUNCH.md); CI holds no Cloudflare secrets.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - run: npm run check
      - run: node scripts/hygiene.mjs --history
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: e2e against the production build
        run: |
          npx wrangler d1 migrations apply omt --local
          npx astro preview --port 4322 &
          for i in $(seq 1 60); do curl -sf http://localhost:4322/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:4322 npx playwright test
        env:
          CI: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .wrangler
      - run: docker compose up -d --build
        env:
          OMT_UID: "1001"
          OMT_GID: "1001"
      - run: |
          for i in $(seq 1 90); do curl -sf http://localhost:4321/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:4321/ | grep -q "One more thing"
          curl -sf http://localhost:4321/zh/ | grep -q "陈广宇"
      - if: failure()
        run: docker compose logs
